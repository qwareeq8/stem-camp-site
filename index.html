<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Conservative CSP for a static host: self-hosted scripts only, Google
         Fonts for styles and fonts, and https connections for the Supabase
         project URL that is injected at build time. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>STEM Camp Field Notebook</title>
    <meta
      name="description"
      content="Field-notebook site for two summer STEM camps: From Trees to Tech and PY-STEM. Schedule, leaderboard, teams, achievements, and an interactive station deck for both camps."
    />
    <meta name="theme-color" content="#9D2235" />
    <!-- Social / link-preview cards. og:image uses an absolute URL because
         scrapers do not resolve the Vite %BASE_URL% token. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qwareeq8.github.io/stem-camp-site/" />
    <meta property="og:title" content="STEM Camp Field Notebook" />
    <meta
      property="og:description"
      content="Two summer STEM camps, one field notebook: From Trees to Tech and PY-STEM. Schedule, leaderboard, teams, achievements, and an interactive station deck."
    />
    <meta property="og:image" content="https://qwareeq8.github.io/stem-camp-site/og-card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="STEM Camp Field Notebook" />
    <meta
      name="twitter:description"
      content="Two summer STEM camps, one field notebook: From Trees to Tech and PY-STEM."
    />
    <meta name="twitter:image" content="https://qwareeq8.github.io/stem-camp-site/og-card.png" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="icon" href="%BASE_URL%logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
