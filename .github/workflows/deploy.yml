name: Deploy site to GitHub Pages

# Build the Vite site and publish dist/ to GitHub Pages.
# Enable Pages in the repo settings with Source set to GitHub Actions.
# Keep Vite's base "./" so assets work under the project subpath.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Inject the Supabase connection from repo Actions secrets and variables.
          # Leave these unset to build a seed-only public site with admin sign-in disabled.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_TABLE: ${{ vars.VITE_SUPABASE_TABLE }}
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Package GitHub Pages artifact
        run: |
          tar --dereference --hard-dereference --directory dist -cvf artifact.tar .
          gzip --best -f artifact.tar

      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: artifact.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
